# ===================================================================
# CONFIGURAÇÃO GERAL DA APLICAÇÃO - ADMIN API
# Valores sensíveis vêm de VARIÁVEIS DE AMBIENTE (veja .env.example).
# Os padrões abaixo servem para rodar localmente / no Docker Swarm.
# ===================================================================
spring.application.name=conectaavida-admin-api
server.port=${SERVER_PORT:8080}

# ===================================================================
# BANCO POSTGRESQL (serviço "postgres" do Swarm ou Supabase)
#   Supabase: DB_URL=jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:6543/postgres?prepareThreshold=0
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/conectavida}
spring.datasource.username=${DB_USERNAME:conectavida}
spring.datasource.password=${DB_PASSWORD:conectavida}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ===================================================================
# CONFIGURAÇÕES DO HIBERNATE E FLYWAY
# ===================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.open-in-view=true

# ===================================================================
# ALTA PERFORMANCE (JAVA 21)
# ===================================================================
spring.threads.virtual.enabled=true

# ===================================================================
# CONFIGURAÇÕES DE ENVIO DE E-MAIL (ALERTA DE SEGURANÇA) - opcional
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===================================================================
# CONFIGURAÇÕES DE BLINDAGEM E SEGURANÇA DA API (OWASP REQS)
# CONECTA_API_SALT precisa ser o MESMO usado quando as senhas foram criadas.
# ===================================================================
app.security.salt=${CONECTA_API_SALT:troque-este-salt-em-producao}
app.security.allowed-origins=${CONECTA_CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:8088,http://localhost}

# ===================================================================
# OBSERVABILIDADE (ACTUATOR)
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

# ===================================================================
# RESILIENCE4J (CIRCUIT BREAKER PARA O E-MAIL)
# ===================================================================
resilience4j.circuitbreaker.instances.smtpService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.smtpService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.smtpService.waitDurationInOpenState=10s
