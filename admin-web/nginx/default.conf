# Nginx do container admin-web
#  - Serve o build estático do React (SPA)
#  - Encaminha /api/* para o serviço admin-api do Swarm (DNS interno da rede overlay)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver DNS interno do Docker: permite que o Nginx suba antes da admin-api
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $admin_api http://admin-api:8080;

    location /api/ {
        proxy_pass $admin_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10m;   # upload de CSV de usuários
    }

    # Rotas do React Router (/usuarios, /campanhas/3...) voltam para o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos com hash no nome podem ficar em cache por 1 ano
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
