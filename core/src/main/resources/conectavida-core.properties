# ======================================================================
# Configuração COMPARTILHADA pelas duas APIs (admin-api e mobile-api).
# Cada API importa este arquivo no seu application.properties.
# Todos os valores sensíveis vêm de variáveis de ambiente.
# ======================================================================

# --- Banco PostgreSQL (container "postgres" no Swarm ou Supabase) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/conectavida}
spring.datasource.username=${DB_USERNAME:conectavida}
spring.datasource.password=${DB_PASSWORD:conectavida}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# validate = só confere o schema (criado por infra/postgres/init/01-schema.sql)
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.flyway.enabled=false

# --- Mensageria RabbitMQ (admin-api publica, mobile-api consome) ---
app.mensageria.enabled=${MENSAGERIA_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# Mensagem que falhar no consumidor é descartada (evita loop infinito de reentrega)
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# --- SMTP (opcional) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# --- Segurança e integrações ---
app.security.salt=${CONECTA_API_SALT:troque-este-salt-em-producao}
app.security.allowed-origins=${CONECTA_CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8088,http://localhost}
fcm.server.key=${FCM_SERVER_KEY:}

# --- Health check (usado pelo Docker/Swarm) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
management.health.rabbit.enabled=${MENSAGERIA_ENABLED:false}
