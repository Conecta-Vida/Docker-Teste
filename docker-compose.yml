# =====================================================================
# Stack Docker Swarm - Conecta Vida (conecta-vida-backend + admin V2 + app)
#   docker stack deploy -c docker-compose.yml conectavida
#
# 7 serviços na rede overlay "conectavida-net":
#   1 postgres (5432)     2 admin-api (8080)     3 mobile-api (8081)
#   4 visualizer (8085)   5 admin-web (8088, painel React)
#   6 mobile-web (8089, app Flutter no navegador)
#   7 painel-cluster (8090, visualizador próprio do Conecta Vida - diferencial)
#
# As imagens nossas são lidas do registry local do cluster
# (REGISTRY=127.0.0.1:5000), para que os workers também consigam baixá-las.
# Veja documentacao/DOCKER_SWARM.md e infra/swarm/seminario.sh.
# =====================================================================

x-api-env: &api-env
  DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-conectavida}
  DB_USERNAME: ${POSTGRES_USER:-conectavida}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-conectavida}
  DB_POOL_SIZE: "5"
  CONECTA_API_SALT: ${CONECTA_API_SALT:-troque-este-salt-em-producao}
  CONECTA_CORS_ORIGINS: ${CONECTA_CORS_ORIGINS:-http://localhost:5173,http://localhost:8088,http://localhost:8089,http://localhost}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}

x-rolling-update: &rolling-update
  parallelism: 1
  order: start-first
  monitor: 30s             # observa cada réplica nova por 30s
  failure_action: rollback # se falhar, volta sozinho para a versão anterior

services:

  # 1. Banco de dados relacional ------------------------------------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conectavida}
      POSTGRES_USER: ${POSTGRES_USER:-conectavida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conectavida}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    configs:
      - source: db-schema
        target: /docker-entrypoint-initdb.d/01-schema.sql
      - source: db-seed
        target: /docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      # $$ = variável lida dentro do container (não pelo compose)
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - conectavida-net
    deploy:
      labels:
        conectavida.camada: "dados"
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure

  # 2. API do painel administrativo ---------------------------------
  admin-api:
    image: ${REGISTRY:-127.0.0.1:5000}/conectavida/admin-api:${TAG:-1.0}
    environment:
      <<: *api-env
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:          # ignorado pelo Swarm; a restart_policy cobre a espera
      - postgres
    networks:
      - conectavida-net
    deploy:
      labels:
        conectavida.camada: "backend-admin"
      replicas: ${ADMIN_API_REPLICAS:-2}   # número de cópias (variável ADMIN_API_REPLICAS)
      update_config: *rolling-update
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # 3. API do aplicativo do cidadão ---------------------------------
  mobile-api:
    image: ${REGISTRY:-127.0.0.1:5000}/conectavida/mobile-api:${TAG:-1.0}
    environment:
      <<: *api-env
      SERVER_PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    networks:
      - conectavida-net
    deploy:
      labels:
        conectavida.camada: "backend-mobile"
      replicas: ${MOBILE_API_REPLICAS:-3}   # número de cópias (variável MOBILE_API_REPLICAS)
      update_config: *rolling-update
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # 4. Painel gráfico do cluster ------------------------------------
  visualizer:
    image: dockersamples/visualizer:stable
    ports:
      - "8085:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - conectavida-net
    deploy:
      labels:
        conectavida.camada: "monitoramento"
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure

  # 5. Front-end: painel administrativo V2 (React servido pelo Nginx)
  admin-web:
    image: ${REGISTRY:-127.0.0.1:5000}/conectavida/admin-web:${TAG:-1.0}
    ports:
      - "8088:80"
    depends_on:
      - admin-api
    networks:
      - conectavida-net
    deploy:
      labels:
        conectavida.camada: "frontend-admin"
      replicas: ${ADMIN_WEB_REPLICAS:-2}   # número de cópias (variável ADMIN_WEB_REPLICAS)
      update_config: *rolling-update
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 64M

  # 6. Front-end: app do cidadão (Flutter Web servido pelo Nginx) ----
  mobile-web:
    image: ${REGISTRY:-127.0.0.1:5000}/conectavida/mobile-web:${TAG:-1.0}
    ports:
      - "8089:80"
    depends_on:
      - mobile-api
    networks:
      - conectavida-net
    deploy:
      labels:
        conectavida.camada: "frontend-app"
      replicas: ${MOBILE_WEB_REPLICAS:-2}   # número de cópias (variável MOBILE_WEB_REPLICAS)
      update_config: *rolling-update
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 64M

  # 7. Diferencial: Painel do Cluster Conecta Vida (visualizador próprio) --
  #    Mostra nós, réplicas e eventos ao vivo e permite escalar pela tela.
  painel-cluster:
    image: ${REGISTRY:-127.0.0.1:5000}/conectavida/painel-cluster:${TAG:-1.0}
    environment:
      STACK: conectavida
    ports:
      - "8090:8090"
    volumes:
      # Leitura e escrita: o painel também altera as réplicas (botões + e −)
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - conectavida-net
    deploy:
      labels:
        conectavida.camada: "monitoramento"
      replicas: 1
      placement:
        constraints: [node.role == manager]   # só o manager conhece o cluster todo
      restart_policy:
        condition: on-failure

networks:
  conectavida-net:
    driver: overlay
    attachable: true

volumes:
  postgres-data:

configs:
  db-schema:
    file: ./infra/postgres/init/01-schema.sql
  db-seed:
    file: ./infra/postgres/init/02-seed.sql
