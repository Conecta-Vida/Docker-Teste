# =====================================================================
# Stack Docker Swarm - Conecta Vida
#   docker stack deploy -c docker-compose.yml conectavida
#
# Serviços na rede overlay "conectavida-net":
#   1 postgres (5432)   2 rabbitmq (5672/15672)   3 admin-api (8080)
#   4 mobile-api (8081) 5 visualizer (8085)       6 admin-web (8088, front React)
#
# As imagens das APIs são lidas do registry local do cluster
# (REGISTRY=127.0.0.1:5000), para que os workers também consigam baixá-las.
# Veja documentacao/DOCKER_SWARM.md e infra/swarm/seminario.sh.
# =====================================================================

x-api-env: &api-env
  DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-conectavida}
  DB_USERNAME: ${POSTGRES_USER:-conectavida}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-conectavida}
  DB_POOL_SIZE: "5"
  MENSAGERIA_ENABLED: "true"
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: ${RABBITMQ_USER:-conectavida}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-conectavida}
  CONECTA_API_SALT: ${CONECTA_API_SALT:-troque-este-salt-em-producao}
  CONECTA_CORS_ORIGINS: ${CONECTA_CORS_ORIGINS:-http://localhost:5173,http://localhost:8088,http://localhost}
  FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}

services:

  # 1. Banco de dados relacional ------------------------------------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conectavida}
      POSTGRES_USER: ${POSTGRES_USER:-conectavida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conectavida}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    configs:
      - source: db-schema
        target: /docker-entrypoint-initdb.d/01-schema.sql
      - source: db-seed
        target: /docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conectavida -d conectavida"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - conectavida-net
    deploy:
      labels:
        conectavida.camada: "dados"
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure

  # 2. Broker de mensageria -----------------------------------------
  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-conectavida}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-conectavida}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # painel web do RabbitMQ
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - conectavida-net
    deploy:
      labels:
        conectavida.camada: "mensageria"
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure

  # 3. API do painel administrativo ---------------------------------
  admin-api:
    image: ${REGISTRY:-127.0.0.1:5000}/conectavida/admin-api:${TAG:-1.0}
    environment:
      <<: *api-env
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:          # ignorado pelo Swarm; a restart_policy cobre a espera
      - postgres
      - rabbitmq
    networks:
      - conectavida-net
    deploy:
      labels:
        conectavida.camada: "backend-admin"
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # 4. API do aplicativo do cidadão ---------------------------------
  mobile-api:
    image: ${REGISTRY:-127.0.0.1:5000}/conectavida/mobile-api:${TAG:-1.0}
    environment:
      <<: *api-env
      SERVER_PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - conectavida-net
    deploy:
      labels:
        conectavida.camada: "backend-mobile"
      replicas: 3
      update_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # 6. Front-end: painel administrativo (React servido pelo Nginx) ---
  admin-web:
    image: ${REGISTRY:-127.0.0.1:5000}/conectavida/admin-web:${TAG:-1.0}
    ports:
      - "8088:80"
    depends_on:
      - admin-api
    networks:
      - conectavida-net
    deploy:
      replicas: 2
      labels:
        conectavida.camada: "frontend"
      update_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 64M

  # 5. Painel gráfico do cluster ------------------------------------
  visualizer:
    image: dockersamples/visualizer:stable
    ports:
      - "8085:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - conectavida-net
    deploy:
      labels:
        conectavida.camada: "monitoramento"
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure

networks:
  conectavida-net:
    driver: overlay
    attachable: true

volumes:
  postgres-data:
  rabbitmq-data:

configs:
  db-schema:
    file: ./infra/postgres/init/01-schema.sql
  db-seed:
    file: ./infra/postgres/init/02-seed.sql
