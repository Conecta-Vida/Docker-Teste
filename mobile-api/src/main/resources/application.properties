# ===================================================================
# CONFIGURAÇÃO GERAL DA APLICAÇÃO - MOBILE API
# Valores sensíveis vêm de VARIÁVEIS DE AMBIENTE (veja .env.example).
# ===================================================================
spring.application.name=conectaavida-mobile-api
server.port=${SERVER_PORT:8081}

# ===================================================================
# BANCO POSTGRESQL (serviço "postgres" do Swarm ou Supabase)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/conectavida}
spring.datasource.username=${DB_USERNAME:conectavida}
spring.datasource.password=${DB_PASSWORD:conectavida}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ===================================================================
# CONFIGURAÇÕES DO HIBERNATE E FLYWAY
# ===================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.open-in-view=true

# ===================================================================
# ALTA PERFORMANCE (JAVA 21)
# ===================================================================
spring.threads.virtual.enabled=true

# ===================================================================
# E-MAIL (recuperação de senha) - opcional
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===================================================================
# CONFIGURAÇÕES DE BLINDAGEM E SEGURANÇA
# CONECTA_API_SALT precisa ser o MESMO da admin-api.
# ===================================================================
app.security.salt=${CONECTA_API_SALT:troque-este-salt-em-producao}
app.security.allowed-origins=${CONECTA_CORS_ORIGINS_APP:http://localhost:*,http://127.0.0.1:*}

# ===================================================================
# OBSERVABILIDADE (ACTUATOR)
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
